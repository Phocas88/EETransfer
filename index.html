<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>EE Toano Transfer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
:root{
  --bg:#0f1d2e;--surface:#162840;--card:#1a3050;--border:#2a4a6a;
  --accent:#00d4ff;--green:#22e88a;--red:#ff5f5f;--purple:#b89dff;
  --toano:#fbbf24;--text:#e8f4ff;--muted:#7aa0c0;
  --font:'Barlow Condensed',sans-serif;--body:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
input,button,select,textarea{font-family:var(--body)}
button{cursor:pointer}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{animation:spin .7s linear infinite}
.pulse{animation:pulse 1.8s infinite}
.pop{animation:pop .18s cubic-bezier(.34,1.56,.64,1) both}

#app{display:flex;flex-direction:column;min-height:100vh}
.main{max-width:1100px;margin:0 auto;padding:20px 16px;width:100%}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%}

#name-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.name-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:40px 32px;width:100%;max-width:380px;text-align:center}
.name-card h1{font-family:var(--font);font-size:3rem;font-weight:900;color:var(--accent);letter-spacing:.04em;line-height:1;margin-bottom:2px}
.name-card .sub{color:var(--toano);font-size:.75rem;font-family:var(--font);font-weight:700;letter-spacing:.15em;margin-bottom:20px}

header{background:var(--surface);border-bottom:2px solid var(--accent);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:200}
.h-title{font-family:var(--font);font-size:1.4rem;font-weight:900;color:var(--accent);letter-spacing:.05em}
.h-badge{background:rgba(245,158,11,.15);border:1px solid var(--toano);color:var(--toano);font-family:var(--font);font-size:.62rem;font-weight:700;letter-spacing:.12em;padding:2px 8px;border-radius:20px;margin-left:8px}
.h-sub{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block}

.btn{border:none;border-radius:8px;padding:0 22px;height:46px;font-family:var(--font);font-size:1rem;font-weight:800;letter-spacing:.06em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .1s;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-accent{background:var(--accent);color:#000}
.btn-green{background:var(--green);color:#000}
.btn-amber{background:var(--toano);color:#000}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--text);color:var(--text)}
.btn-sm{height:34px;padding:0 14px;font-size:.82rem}
.btn-tab{background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:6px;font-family:var(--font);font-size:.88rem;font-weight:700;letter-spacing:.06em;transition:all .15s;cursor:pointer}
.btn-tab:hover{border-color:var(--accent);color:var(--accent)}
.btn-tab.active{background:var(--accent);color:#000;border-color:var(--accent)}

.inp{background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border-color .15s;padding:12px 14px}
.inp:focus{border-color:var(--accent)}
.inp:disabled{opacity:.45}
.inp-lg{font-size:1.4rem;font-family:var(--font);font-weight:700;letter-spacing:.06em}
.inp-md{font-size:1.1rem;font-family:var(--font);font-weight:700}
.inp-sm{font-size:.88rem;padding:7px 12px}

.card{background:var(--card);border:1.5px solid var(--border);border-radius:12px}
.p16{padding:16px}.p20{padding:20px}

.scan-bar{position:sticky;top:62px;z-index:100;background:var(--card);border:1.5px solid var(--border);border-radius:0 0 12px 12px;padding:16px 20px;margin-bottom:16px}

.result-found{background:#091820;border:2px solid var(--accent);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.result-unknown{background:#1f0a0a;border:2px solid var(--red);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.result-dest{font-family:var(--font);font-size:1.8rem;font-weight:800;line-height:1.1;margin-bottom:4px;color:var(--toano)}

.pallet-lock{background:rgba(0,200,255,.08);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:.85rem}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;border:1px solid;white-space:nowrap}
.b-toano{background:rgba(245,158,11,.12);border-color:var(--toano);color:var(--toano)}
.b-green{background:rgba(31,212,128,.12);border-color:var(--green);color:var(--green)}
.b-red{background:rgba(255,77,77,.12);border-color:var(--red);color:var(--red)}
.b-accent{background:rgba(0,200,255,.12);border-color:var(--accent);color:var(--accent)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{padding:16px 18px}
.kpi-lbl{font-family:var(--font);font-size:.65rem;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.kpi-val{font-family:var(--font);font-size:2rem;font-weight:900;line-height:1}
.kpi-sub{font-size:.72rem;color:var(--muted);margin-top:3px}

.tbl-wrap{overflow-x:auto;border-radius:10px;border:1.5px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead tr{background:var(--surface)}
th{padding:10px 14px;text-align:left;font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--muted);border-bottom:1.5px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--accent)}
td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}

.feed-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.feed-row:last-child{border-bottom:none}

.pallet-card{padding:16px 18px;margin-bottom:10px}
.pallet-id{font-family:var(--font);font-size:1.3rem;font-weight:900;color:var(--accent)}
.item-tag{padding:3px 10px;border-radius:6px;font-size:.78rem;font-weight:600;background:var(--surface);border:1px solid var(--border)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:800;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}

#toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:.88rem;font-weight:500;z-index:9998;display:none;background:var(--card);border:1.5px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:300px}

.section-lbl{font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:.9rem}
.flex{display:flex}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.wrap{flex-wrap:wrap}.center{align-items:center}.between{justify-content:space-between}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.w100{width:100%}

/* EE accent stripe on scan bar */
.scan-bar::before{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--accent),var(--toano));border-radius:2px;margin-bottom:14px}

/* Camera overlay — exact RTP implementation */
#camOverlay{display:none;position:fixed;inset:0;background:#000;z-index:2000;flex-direction:column;}
#camOverlay.active{display:flex;}
.cam-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(0,0,0,0.85);}
.cam-title{font-family:var(--font);font-size:13px;color:#fff;letter-spacing:1px;font-weight:700;}
.cam-engine{font-size:10px;opacity:0.6;}
.cam-close{background:none;border:1px solid rgba(255,255,255,0.25);border-radius:8px;color:#fff;font-size:13px;padding:7px 14px;cursor:pointer;}
.cam-video-wrap{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#camVideo{width:100%;height:100%;object-fit:cover;}
.cam-reticle{position:absolute;width:72%;max-width:280px;height:140px;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,0.55);pointer-events:none;}
.cam-reticle-corner{position:absolute;width:20px;height:20px;border-color:var(--accent);border-style:solid;opacity:0.9;}
.cam-reticle-corner.tl{top:-3px;left:-3px;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
.cam-reticle-corner.tr{top:-3px;right:-3px;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
.cam-reticle-corner.bl{bottom:-3px;left:-3px;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
.cam-reticle-corner.br{bottom:-3px;right:-3px;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
.cam-hint{position:absolute;bottom:20px;font-size:12px;color:rgba(255,255,255,0.7);text-align:center;width:100%;letter-spacing:0.3px;}
.cam-status{padding:12px 16px;background:rgba(0,0,0,0.9);font-size:13px;color:var(--muted);text-align:center;font-family:var(--font);min-height:46px;display:flex;align-items:center;justify-content:center;}
.cam-status.found{color:var(--green);}
.cam-status.err{color:var(--red);}

@media(max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none!important}}
</style>
</head>

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let db;
let workerName = "";
let tab = "pick";           // pick | manager
let subTab = "pallets";     // pallets | activity
let managerUnlocked = false;
let liveData = { pallets: {}, log: [] };
let pendingScan = null;
let palletLock = null;
let palletChoice = null;
let saving = false;
let palletSortCol = "created", palletSortAsc = false;
let actSortCol = "ts", actSortAsc = false;
let searchStr = "";

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
function boot() {
  try {
    const fbApp = initializeApp(FIREBASE_CONFIG);
    db = getDatabase(fbApp);
    let firstConnect = true;

    onValue(ref(db, "transfer"), snap => {
      const d = snap.val() || {};
      liveData.pallets = d.pallets || {};
      liveData.log = d.log
        ? Object.entries(d.log).map(([k,v]) => ({...v, _key:k})).sort((a,b) => b.ts - a.ts)
        : [];

      if (firstConnect) {
        firstConnect = false;
        document.getElementById("loading").style.display = "none";
        document.getElementById("app").style.display = "flex";
        const saved = localStorage.getItem("ee_worker_name");
        if (saved) { workerName = saved; renderShell(); renderView(); setupPresence(workerName); }
        else showNameScreen();
      } else {
        if (tab === "pick") renderView();
        else updateManagerKPIs();
      }
    });
  } catch(e) {
    document.getElementById("loading").innerHTML =
      '<div style="color:var(--red);font-family:var(--font);text-align:center;padding:40px">' +
      '<div style="font-size:2rem;margin-bottom:12px">⚠</div>' +
      '<div>Firebase connection failed.<br>Check Realtime Database is enabled.</div></div>';
  }
}

// ═══════════════════════════════════════════════════════
// PRESENCE
// ═══════════════════════════════════════════════════════
function setupPresence(name) {
  if (!db || !name) return;
  const pr = ref(db, "presence/" + name.replace(/[.#$\/\[\]]/g,"_") + "_" + Date.now());
  update(pr.parent, { [pr.key]: { name, ts: Date.now() } });
  onDisconnect(pr).remove();
}

// ═══════════════════════════════════════════════════════
// NAME SCREEN
// ═══════════════════════════════════════════════════════
function showNameScreen() {
  document.getElementById("app").innerHTML =
    '<div id="name-screen">' +
      '<div class="name-card pop">' +
        '<h1>EE TRANSFER</h1>' +
        '<div class="sub">→ TOANO WAREHOUSE</div>' +
        '<input id="name-inp" class="inp inp-md w100" placeholder="Your name (e.g. Maria)" style="margin-bottom:12px" autofocus>' +
        '<button class="btn btn-accent w100" id="name-btn">START SCANNING</button>' +
      '</div>' +
    '</div>';
  document.getElementById("name-btn").onclick = submitName;
  document.getElementById("name-inp").onkeydown = e => { if (e.key === "Enter") submitName(); };
}

function submitName() {
  const v = (document.getElementById("name-inp")?.value || "").trim();
  if (!v) return;
  workerName = v;
  localStorage.setItem("ee_worker_name", v);
  renderShell();
  renderView();
  setupPresence(workerName);
}

// ═══════════════════════════════════════════════════════
// SHELL
// ═══════════════════════════════════════════════════════
function renderShell() {
  document.getElementById("app").innerHTML =
    '<header>' +
      '<div>' +
        '<div style="display:flex;align-items:center">' +
          '<span class="h-title">EE TOANO TRANSFER</span>' +
          '<span class="h-badge">EVER ELLIS</span>' +
        '</div>' +
        '<div class="h-sub">' +
          '<span class="live-dot pulse"></span>' +
          '<span>LIVE</span>' +
          '<span style="color:var(--border)">·</span>' +
          '<span id="hdr-name">' + esc(workerName) + '</span>' +
          '<span id="hdr-sync" style="color:var(--border)"></span>' +
        '</div>' +
      '</div>' +
      '<div class="flex gap8">' +
        '<button class="btn-tab active" id="tab-pick" style="font-size:.8rem">📦 SCAN</button>' +
        '<button class="btn-tab" id="tab-mgr" style="font-size:.8rem">📊 MANAGER</button>' +
      '</div>' +
    '</header>' +
    '<div id="main-content"></div>';

  document.getElementById("tab-pick").onclick = () => {
    tab = "pick"; renderView();
    document.getElementById("tab-pick").classList.add("active");
    document.getElementById("tab-mgr").classList.remove("active");
  };
  document.getElementById("tab-mgr").onclick = () => {
    if (!managerUnlocked) { showPinModal(); return; }
    tab = "manager"; renderManager();
    document.getElementById("tab-mgr").classList.add("active");
    document.getElementById("tab-pick").classList.remove("active");
  };
}

function renderView() {
  if (tab === "pick") renderPick();
  else renderManager();
}

// ═══════════════════════════════════════════════════════
// PICK VIEW
// ═══════════════════════════════════════════════════════
function renderPick() {
  const mc = document.getElementById("main-content");
  if (!mc) return;

  const totalPallets = Object.keys(liveData.pallets).length;

// ═══════════════════════════════════════════════════════
// SCAN HANDLER
// ═══════════════════════════════════════════════════════
function doScan() {
  const inp = document.getElementById("scan-inp");
  if (!inp) return;
  const raw = inp.value.trim().toUpperCase();
  if (!raw) return;
  inp.value = "";

  // Check if it's a pallet ID (EE##### pattern or existing pallet)
  if (isPalletId(raw)) {
    if (pendingScan) {
      const palInp = document.getElementById("pallet-inp");
      if (palInp) {
        palInp.value = raw;
        palInp.style.borderColor = "var(--green)";
        showToast("🪟 Pallet " + raw + " — enter qty and confirm", "var(--green)");
        document.getElementById("qty-inp")?.focus();
      }
    } else {
      palletLock = raw;
      showToast("🪟 Pallet " + raw + " locked — scan a product", "var(--accent)");
      renderPick();
    }
    return;
  }

  // Try barcode lookup (UPC/GTIN) first
  let code = BARCODE_LOOKUP[raw] || null;

  // If not a barcode, treat as direct product code
  if (!code) {
    code = raw;
  }

  code = code.toUpperCase();
  const product = EE_PRODUCTS[code];

  if (!product) {
    pendingScan = { found: false, code, barcode: raw !== code ? raw : null };
    renderPick();
    return;
  }

  pendingScan = {
    found: true,
    code,
    barcode: raw !== code ? raw : null,
    bin: product.bin || "",
    upc: product.upc || "",
    gtin: product.gtin || "",
  };
  if (palletLock) { palletChoice = "join"; }
  renderPick();
}

function isPalletId(v) {
  return /^EE\d{5,}$/i.test(v) || (liveData.pallets && v in liveData.pallets);
}

function attachConfirmEvents() {
  const cancelBtn = document.getElementById("cancel-btn");
  if (cancelBtn) cancelBtn.onclick = () => {
    pendingScan = null; palletLock = null; palletChoice = null; renderPick();
  };
  const backBtn = document.getElementById("back-btn");
  if (backBtn) backBtn.onclick = () => { palletChoice = null; renderPick(); };
  const btnJoin = document.getElementById("btn-join-pallet");
  const btnNew  = document.getElementById("btn-new-pallet");
  if (btnJoin) btnJoin.onclick = () => { palletChoice = "join"; renderPick(); };
  if (btnNew)  btnNew.onclick  = () => { palletChoice = "new";  renderPick(); };

  const palInp = document.getElementById("pallet-inp");
  const qtyInp = document.getElementById("qty-inp");
  if (palInp) {
    palInp.onkeydown = e => { if (e.key === "Enter") qtyInp?.focus(); };
    palInp.onfocus = function() { this.select(); };
    if (palletChoice === "new") setTimeout(() => palInp.focus(), 80);
  }
  if (qtyInp) {
    qtyInp.onkeydown = e => { if (e.key === "Enter") doConfirm(); };
    qtyInp.onfocus = function() { this.select(); };
    if (palletLock) setTimeout(() => qtyInp.focus(), 80);
  }

  // Quick pallet buttons
  document.querySelectorAll(".quick-pallet-btn").forEach(btn => {
    btn.onclick = () => {
      const pi = document.getElementById("pallet-inp");
      if (pi) { pi.value = btn.dataset.pid; document.getElementById("qty-inp")?.focus(); }
    };
  });

  const confBtn = document.getElementById("confirm-btn");
  if (confBtn) confBtn.onclick = doConfirm;
}

function nextPalletNum() {
  const nums = Object.keys(liveData.pallets)
    .filter(p => /^EE\d{5}$/i.test(p))
    .map(p => parseInt(p.slice(2)));
  const n = nums.length ? Math.max(...nums) + 1 : 1;
  return "EE" + String(n).padStart(5, "0");
}

// ═══════════════════════════════════════════════════════
// CONFIRM — save to Firebase
// ═══════════════════════════════════════════════════════
async function doConfirm() {
  if (saving || !pendingScan || !pendingScan.found) return;
  const palInp = document.getElementById("pallet-inp");
  const qtyInp = document.getElementById("qty-inp");
  const effectivePallet = palletLock || (palInp ? palInp.value.trim().toUpperCase() : "");
  if (!effectivePallet) { if (palInp) { palInp.style.borderColor = "var(--red)"; palInp.focus(); } return; }
  const qty = Math.max(1, parseInt(qtyInp?.value) || 1);

  saving = true;
  const confBtn = document.getElementById("confirm-btn");
  if (confBtn) { confBtn.disabled = true; confBtn.textContent = "SAVING..."; }

  const p = pendingScan;
  const code = p.code;
  const ts = Date.now();
  const pid = effectivePallet;

  const existingPallet = liveData.pallets[pid];
  const existingKeys = existingPallet ? Object.keys(existingPallet.items || {}).map(Number) : [];
  const nextIdx = existingKeys.length > 0 ? Math.max(...existingKeys) + 1 : 0;

  const updates = {};

  // Pallet item
  updates["transfer/pallets/" + pid + "/items/" + nextIdx] = {
    item: code, bin: p.bin || "", worker: workerName, ts, qty
  };
  // Pallet meta
  if (!existingPallet) {
    updates["transfer/pallets/" + pid + "/dest"] = "Toano";
    updates["transfer/pallets/" + pid + "/created"] = ts;
    updates["transfer/pallets/" + pid + "/worker"] = workerName;
  }

  // Activity log
  const logKey = "transfer/log/" + ts + "_" + Math.random().toString(36).slice(2, 7);
  updates[logKey] = { ts, worker: workerName, item: code, bin: p.bin||"", pallet: pid, qty };

  try {
    await update(ref(db), updates);
    showToast("✓ " + code + " ×" + qty + " → " + pid, "var(--green)");
    pendingScan = null;
    palletChoice = null;
    if (!palletLock) palletLock = pid; // auto-lock to pallet just used
    saving = false;
    renderPick();
    document.getElementById("scan-inp")?.focus();
  } catch(e) {
    saving = false;
    showToast("Save failed — " + (e.message || String(e)), "var(--red)");
    if (confBtn) { confBtn.disabled = false; confBtn.textContent = "✓ CONFIRM"; }
  }
}

function updateManagerKPIs() {

function renderManager() {
  const mc = document.getElementById("main-content");
  if (!mc) return;

  const allPallets = Object.entries(liveData.pallets);
  const totalPallets = allPallets.length;
  let totalUnits = 0, totalSkus = new Set();
  for (const [, pd] of allPallets) {
    for (const it of Object.values(pd.items||{})) {
      totalUnits += (it.qty||1);
      totalSkus.add(it.item);
    }
  }
  const today = new Date().toDateString();
  const todayUnits = liveData.log.filter(l => new Date(l.ts).toDateString() === today)
    .reduce((s,l) => s + (l.qty||1), 0);

  let html = '<div class="main">';

  // KPIs
  html += '<div class="kpi-grid mb20">';
  html += kpi("PALLETS BUILT", totalPallets, "Toano transfer", "var(--accent)");
  html += kpi("TOTAL UNITS", totalUnits.toLocaleString(), "across all pallets", "var(--green)");
  html += kpi("UNIQUE SKUs", totalSkus.size, "product codes", "var(--toano)");
  html += kpi("TODAY", todayUnits, "units scanned today", "var(--purple)");
  html += '</div>';

  // Sub-tab nav
  html += '<div class="flex between center mb16 wrap gap10">';
  html += '<div class="flex gap8">';
  html += '<button class="btn-tab ' + (subTab==="pallets"?"active":"") + '" id="st-pallets">🪟 PALLETS</button>';
  html += '<button class="btn-tab ' + (subTab==="activity"?"active":"") + '" id="st-activity">⚡ ACTIVITY</button>';
  html += '</div>';
  html += '<div class="flex gap8">';
  html += '<button class="btn btn-outline btn-sm" id="export-btn" style="color:var(--green);border-color:var(--green)">⬇ EXPORT CSV</button>';
  html += '</div>';
  html += '</div>';

  html += '<div id="subtab">';
  if (subTab === "pallets") html += buildPalletsView();
  else html += buildActivityFeed();
  html += '</div>';

  html += '</div>';
  mc.innerHTML = html;

  document.getElementById("st-pallets").onclick  = () => { subTab="pallets";  refreshSubTab(); };
  document.getElementById("st-activity").onclick = () => { subTab="activity"; refreshSubTab(); };
  document.getElementById("export-btn").onclick = exportCSV;

  attachManagerEvents();
}

function kpi(lbl, val, sub, color) {
  return '<div class="card kpi">' +
    '<div class="kpi-lbl">' + lbl + '</div>' +
    '<div class="kpi-val" style="color:' + color + '">' + val + '</div>' +

}

function refreshSubTab() {
  const el = document.getElementById("subtab");
  if (!el) return;
  document.querySelectorAll(".btn-tab").forEach(b => {
    b.classList.toggle("active",
      (subTab==="pallets"  && b.id==="st-pallets") ||
      (subTab==="activity" && b.id==="st-activity"));
  });
  el.innerHTML = subTab === "pallets" ? buildPalletsView() : buildActivityFeed();
  attachManagerEvents();
}

function attachManagerEvents() {
  document.querySelectorAll(".pallet-print-btn").forEach(btn => {
    btn.onclick = () => printPalletTag(btn.dataset.pid);
  });
  document.querySelectorAll(".pallet-edit-btn").forEach(btn => {
    btn.onclick = () => editPalletModal(btn.dataset.pid);
  });
}

// ── Pallets view ─────────────────────────────────────────────
function buildPalletsView() {
  const pallets = Object.entries(liveData.pallets);
  if (!pallets.length) return '<div class="empty">No pallets built yet</div>';

  pallets.sort((a,b) => {
    if (palletSortCol === "created") return palletSortAsc ? (a[1].created||0)-(b[1].created||0) : (b[1].created||0)-(a[1].created||0);
    return palletSortAsc ? a[0].localeCompare(b[0]) : b[0].localeCompare(a[0]);
  });

  let html = '<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">';
  html += '<input id="pal-search" class="inp inp-sm" placeholder="🔍 Search pallet # or item..." value="' + esc(searchStr) + '" style="flex:1;min-width:200px">';
  html += '</div>';

  const filterStr = searchStr.toLowerCase();

  let html2 = '';
  let shown = 0;
  for (const [pid, pd] of pallets) {
    const items = Object.values(pd.items||{});
    const agg = {};
    for (const it of items) {
      if (!agg[it.item]) agg[it.item] = { qty: 0, bin: it.bin||"", worker: it.worker||"", ts: it.ts||0 };
      agg[it.item].qty += (it.qty||1);
    }
    const totalQty = Object.values(agg).reduce((s,v) => s+v.qty, 0);
    const uniqueSkus = Object.keys(agg).length;

    if (filterStr && !pid.toLowerCase().includes(filterStr) &&
        !Object.keys(agg).some(c => c.toLowerCase().includes(filterStr))) continue;
    shown++;

    html2 += '<div class="card pallet-card mb8">';
    html2 += '<div class="flex between center mb8">';
    html2 += '<div>';
    html2 += '<div class="pallet-id">' + esc(pid) + ' <span class="badge b-toano" style="margin-left:8px">→ TOANO</span></div>';
    html2 += '<div style="font-size:.72rem;color:var(--muted);margin-top:2px">';
    html2 += uniqueSkus + ' SKUs · ' + totalQty + ' units';
    if (pd.created) html2 += ' · ' + new Date(pd.created).toLocaleString();
    if (pd.worker) html2 += ' · Started by ' + esc(pd.worker);
    html2 += '</div></div>';
    html2 += '<div class="flex gap8">';
    html2 += '<button class="btn btn-outline btn-sm pallet-print-btn" data-pid="' + esc(pid) + '">🖨 TAG</button>';
    html2 += '<button class="btn btn-outline btn-sm pallet-edit-btn" data-pid="' + esc(pid) + '">✏ EDIT</button>';
    html2 += '</div></div>';

    // Items table
    html2 += '<div class="tbl-wrap"><table><thead><tr>' +
      '<th>ITEM CODE</th><th>BIN</th><th>QTY</th><th class="hide-sm">WORKER</th><th class="hide-sm">TIME</th>' +
      '</tr></thead><tbody>';
    for (const [code, it] of Object.entries(agg)) {
      html2 += '<tr>' +
        '<td style="font-family:var(--font);font-weight:700;color:var(--accent)">' + esc(code) + '</td>' +
        '<td><span style="font-family:var(--font);font-weight:700;color:var(--toano)">' + (it.bin || '<span style="color:var(--muted)">—</span>') + '</span></td>' +
        '<td style="font-weight:700">×' + it.qty + '</td>' +
        '<td class="hide-sm" style="color:var(--muted);font-size:.78rem">' + esc(it.worker) + '</td>' +
        '<td class="hide-sm" style="color:var(--muted);font-size:.78rem">' + (it.ts ? new Date(it.ts).toLocaleTimeString() : '') + '</td>' +
        '</tr>';
    }
    html2 += '</tbody></table></div></div>';
  }

  if (!shown) html2 = '<div class="empty">No pallets match search</div>';
  html += html2;

  // Attach search event after render
  setTimeout(() => {
    const si = document.getElementById("pal-search");
    if (si) si.oninput = e => { searchStr = e.target.value; refreshSubTab(); };
  }, 0);

  return html;
}

// ── Activity feed ─────────────────────────────────────────────
function buildActivityFeed() {
  const logs = [...liveData.log];
  logs.sort((a,b) => actSortAsc ? a.ts-b.ts : b.ts-a.ts);
  if (!logs.length) return '<div class="empty">No activity yet</div>';

  let html = '<div class="card" style="overflow:hidden">';
  html += '<div style="padding:10px 16px;border-bottom:1px solid var(--border);font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--muted)">' + logs.length + ' SCAN EVENTS</div>';
  for (const s of logs.slice(0, 200)) {

      '<span style="font-size:.7rem;color:var(--muted);min-width:68px;flex-shrink:0">' + new Date(s.ts).toLocaleTimeString() + '</span>' +
      '<span style="font-size:.65rem;color:var(--muted);min-width:55px;flex-shrink:0">' + new Date(s.ts).toLocaleDateString() + '</span>' +
      '<span style="font-family:var(--font);font-weight:700;color:var(--accent);min-width:90px;flex-shrink:0">' + esc(s.item||"") + '</span>' +

function editPalletModal(pid) {
  const pdata = liveData.pallets[pid];
  if (!pdata) return;

  // Aggregate items
  const rawItems = pdata.items || {};
  const agg = {};
  for (const [k, it] of Object.entries(rawItems)) {
    const code = it.item;
    if (!agg[code]) agg[code] = { bin: it.bin||"", totalQty: 0, keys: [] };
    agg[code].totalQty += (it.qty||1);
    agg[code].keys.push(k);
  }

  const div = document.createElement("div");
  div.className = "overlay";
  div.onclick = e => { if (e.target === div) closeModal(); };

  let html = '<div class="modal pop" style="max-width:500px">';
  html += '<div style="font-family:var(--font);font-size:1.5rem;font-weight:900;color:var(--accent);margin-bottom:2px">✏ ' + esc(pid) + '</div>';
  html += '<div style="color:var(--muted);font-size:.78rem;margin-bottom:14px">Edit quantities or delete items</div>';

  // Add item section
  html += '<div style="font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:8px">ADD ITEM</div>';
  html += '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
  html += '<input id="add-item-code" class="inp" placeholder="EE product code or UPC/GTIN" style="flex:2;min-width:140px;padding:10px 12px;font-family:var(--font);font-weight:700;font-size:.95rem" autofocus>';
  html += '<input id="add-item-qty" class="inp" type="number" min="1" max="9999" value="1" style="width:70px;padding:10px 8px;text-align:center;font-family:var(--font);font-weight:700">';
  html += '<button id="add-item-btn" class="btn btn-green" style="padding:0 16px">+ ADD</button>';
  html += '</div>';
  html += '<div id="add-item-msg" style="font-size:.75rem;min-height:18px;margin-bottom:10px"></div>';

  // Items list
  html += '<div style="font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:8px">ITEMS ON PALLET</div>';
  html += '<div style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:16px">';
  for (const [code, it] of Object.entries(agg)) {
    html += '<div style="display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px">';
    html += '<span style="font-family:var(--font);font-weight:700;color:var(--accent);min-width:80px">' + esc(code) + '</span>';
    if (it.bin) html += '<span style="font-size:.72rem;color:var(--toano);font-family:var(--font);font-weight:700;min-width:50px">' + esc(it.bin) + '</span>';
    html += '<input type="number" class="qty-edit-inp inp" min="0" max="9999" value="' + it.totalQty + '" data-item="' + esc(code) + '" ' +
      'style="width:64px;padding:4px 8px;font-size:.9rem;font-family:var(--font);font-weight:700;text-align:center" title="Set to 0 to delete">';
    html += '<button class="del-item-btn" data-item="' + esc(code) + '" ' +
      'style="background:none;border:1px solid var(--red);color:var(--red);border-radius:5px;padding:3px 8px;font-size:.8rem;cursor:pointer;margin-left:auto">🗑</button>';
    html += '</div>';
  }
  if (!Object.keys(agg).length) html += '<div style="color:var(--muted);font-size:.8rem;padding:8px">No items on this pallet</div>';
  html += '</div>';

  html += '<button class="btn btn-green w100" id="save-qty-btn" style="margin-bottom:14px">💾 SAVE QTY CHANGES</button>';

  html += '<div class="flex gap10">';
  html += '<button class="btn btn-outline" style="flex:1" id="edit-cancel">CLOSE</button>';
  html += '<button class="btn" style="flex:1;background:var(--red);color:#fff" id="delete-pallet-btn">🗑 DELETE PALLET</button>';
  html += '</div></div>';

  div.innerHTML = html;
  document.getElementById("modal-root").appendChild(div);

  document.getElementById("edit-cancel").onclick = closeModal;
  document.getElementById("delete-pallet-btn").onclick = () => doDeletePallet(pid, agg);

  document.getElementById("add-item-btn").onclick = () => doAddItemToPallet(pid);

  document.getElementById("save-qty-btn").onclick = async () => {
    const inputs = div.querySelectorAll(".qty-edit-inp");
    const updates = {};
    for (const inp of inputs) {
      const code = inp.dataset.item;
      const newQty = parseInt(inp.value);
      if (isNaN(newQty) || newQty < 0) continue;
      const it = agg[code]; if (!it) continue;
      if (newQty === it.totalQty) continue;
      if (newQty === 0) {
        for (const k of it.keys) updates["transfer/pallets/" + pid + "/items/" + k] = null;
      } else {
        const firstKey = it.keys[0];
        for (const k of it.keys.slice(1)) updates["transfer/pallets/" + pid + "/items/" + k] = null;
        updates["transfer/pallets/" + pid + "/items/" + firstKey + "/qty"] = newQty;
      }
    }
    if (!Object.keys(updates).length) { showToast("No changes to save", "var(--muted)"); return; }
    try { await update(ref(db), updates); closeModal(); showToast("✓ Qty updated", "var(--green)"); }
    catch(e) { showToast("Save failed", "var(--red)"); }
  };

  div.querySelectorAll(".del-item-btn").forEach(btn => {
    btn.onclick = async () => {
      const code = btn.dataset.item;
      const it = agg[code]; if (!it) return;
      if (!confirm("Remove " + code + " from " + pid + "?")) return;
      const updates = {};
      for (const k of it.keys) updates["transfer/pallets/" + pid + "/items/" + k] = null;
      try { await update(ref(db), updates); closeModal(); showToast("🗑 " + code + " removed", "var(--red)"); }
      catch(e) { showToast("Delete failed", "var(--red)"); }
    };
  });
}

async function doAddItemToPallet(pid) {
  const codeInp = document.getElementById("add-item-code");
  const qtyInp  = document.getElementById("add-item-qty");
  const msg      = document.getElementById("add-item-msg");
  const raw = (codeInp?.value || "").trim().toUpperCase();
  const qty = Math.max(1, parseInt(qtyInp?.value) || 1);
  if (!raw) { if (msg) { msg.textContent = "Enter a product code or barcode"; msg.style.color = "var(--red)"; } return; }

  // Resolve barcode or direct code
  let code = BARCODE_LOOKUP[raw] || raw;
  code = code.toUpperCase();
  const product = EE_PRODUCTS[code];
  if (!product) { if (msg) { msg.textContent = "Not found in EE database: " + code; msg.style.color = "var(--red)"; } return; }

  const pdata = liveData.pallets[pid];
  if (!pdata) { showToast("Pallet not found", "var(--red)"); return; }
  const existingKeys = Object.keys(pdata.items||{}).map(Number);
  const nextIdx = existingKeys.length > 0 ? Math.max(...existingKeys) + 1 : 0;
  const ts = Date.now();

  const updates = {};
  updates["transfer/pallets/" + pid + "/items/" + nextIdx] = { item: code, bin: product.bin||"", worker: workerName, ts, qty };
  const logKey = "transfer/log/" + ts + "_" + Math.random().toString(36).slice(2,7);
  updates[logKey] = { ts, worker: workerName, item: code, bin: product.bin||"", pallet: pid, qty };

  const addBtn = document.getElementById("add-item-btn");
  if (addBtn) { addBtn.disabled = true; addBtn.textContent = "SAVING..."; }
  try {
    await update(ref(db), updates);
    if (codeInp) codeInp.value = "";
    if (qtyInp)  qtyInp.value = "1";
    if (msg) { msg.textContent = "✓ " + code + " ×" + qty + " added"; msg.style.color = "var(--green)"; }
    if (addBtn) { addBtn.disabled = false; addBtn.textContent = "+ ADD"; codeInp?.focus(); }
  } catch(e) {
    if (msg) { msg.textContent = "Error: " + (e.message||String(e)); msg.style.color = "var(--red)"; }
    if (addBtn) { addBtn.disabled = false; addBtn.textContent = "+ ADD"; }
  }
}

async function doDeletePallet(pid, agg) {
  if (!confirm("Delete entire pallet " + pid + "? This cannot be undone.")) return;
  const updates = { ["transfer/pallets/" + pid]: null };
  try { await update(ref(db), updates); closeModal(); showToast("🗑 Pallet " + pid + " deleted", "var(--red)"); }
  catch(e) { showToast("Delete failed", "var(--red)"); }
}

// EXPORT CSV
// ═══════════════════════════════════════════════════════
function exportCSV() {
  const date = new Date().toISOString().slice(0,10);

  // 1. Pallets summary
  const s1 = [["Pallet ID","Destination","Created","Worker","SKUs","Total Units"]];
  for (const [pid, pd] of Object.entries(liveData.pallets).sort((a,b) => a[0].localeCompare(b[0]))) {
    const items = Object.values(pd.items||{});
    const totalQty = items.reduce((s,it) => s+(it.qty||1), 0);
    const skus = new Set(items.map(it=>it.item)).size;
    s1.push([pid,"Toano",pd.created?new Date(pd.created).toLocaleString():"",pd.worker||"",skus,totalQty]);
  }
  downloadCSV("EE_Toano_Pallets_" + date + ".csv", s1);

  // 2. Detail
  setTimeout(() => {
    const s2 = [["Pallet ID","Item Code","Primary Bin","Qty","Worker","Time"]];
    for (const [pid, pd] of Object.entries(liveData.pallets).sort((a,b) => a[0].localeCompare(b[0]))) {
      const agg = {};
      for (const it of Object.values(pd.items||{})) {
        if (!agg[it.item]) agg[it.item] = { bin: it.bin||"", qty: 0, worker: it.worker||"", ts: it.ts||0 };
        agg[it.item].qty += (it.qty||1);
      }
      for (const [code, it] of Object.entries(agg)) {
        s2.push([pid, code, it.bin, it.qty, it.worker, it.ts ? new Date(it.ts).toLocaleString() : ""]);
      }
    }
    downloadCSV("EE_Toano_Detail_" + date + ".csv", s2);
    showToast("2 CSV files downloaded", "var(--green)");
  }, 600);
}

function csvEscape(v) { const s = String(v==null?"":v); return '"'+s.replace(/"/g,'""')+'"'; }
function csvRow(arr) { return arr.map(csvEscape).join(",") + "\r\n"; }
function downloadCSV(filename, rows) {
  const csv = "\uFEFF" + rows.map(r => csvRow(r)).join("");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function showToast(msg, color) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.borderColor = color || "var(--accent)";
  t.style.display = "block";
  clearTimeout(t._tmr);
  t._tmr = setTimeout(() => { t.style.display = "none"; }, 2800);
}

// ═══════════════════════════════════════════════════════
// CAMERA SCANNER — exact RTP implementation
// PATH 1: Native BarcodeDetector (hardware-accelerated, instant on Android Chrome)
// PATH 2: ZXing 0.19.1 fallback
// ═══════════════════════════════════════════════════════
let codeReader = null, cameraActive = false;

const USE_NATIVE = ('BarcodeDetector' in window);
let nativeDetector = null;
if (USE_NATIVE) {
  try {
    nativeDetector = new BarcodeDetector({ formats: [
      'code_128','code_39','code_93','ean_13','ean_8',
      'upc_a','upc_e','qr_code','data_matrix','itf','pdf417'
    ]});
  } catch(e) { nativeDetector = null; }
}

async function openCamera() {
  document.getElementById('camEngineLabel').textContent = USE_NATIVE && nativeDetector ? '· Native' : '· ZXing';
  document.getElementById('camTargetLabel').textContent = 'Scanning EE Product…';
  document.getElementById('camStatus').textContent = 'Initializing camera…';
  document.getElementById('camStatus').className = 'cam-status';
  document.getElementById('camOverlay').classList.add('active');
  cameraActive = true;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1920 }, height: { ideal: 1080 }
    }});
    const track = stream.getVideoTracks()[0];
    if (track && track.applyConstraints) {
      try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }, { zoom: 1 }] }); } catch(e) {}
    }
    const video = document.getElementById('camVideo');
    video.srcObject = stream;
    await video.play();

    if (USE_NATIVE && nativeDetector) {
      // ── PATH 1: Native BarcodeDetector (hardware-accelerated, instant) ──
      document.getElementById('camStatus').textContent = 'Ready — point at barcode';
      const scanFrame = async () => {
        if (!cameraActive) return;
        try {
          const barcodes = await nativeDetector.detect(video);
          if (barcodes.length) {
            const code = barcodes[0].rawValue;
            document.getElementById('camStatus').textContent = '✓ ' + code;
            document.getElementById('camStatus').className = 'cam-status found';
            if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
            cameraActive = false;
            closeCamera();
            handleCameraResult(code);
            return;
          }
        } catch(e) { /* frame not ready */ }
        if (cameraActive) requestAnimationFrame(scanFrame);
      };
      requestAnimationFrame(scanFrame);
    } else {
      // ── PATH 2: ZXing fallback ──
      if (typeof ZXing === 'undefined') throw new Error('Scanner library not loaded.');
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.EAN_13,   ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A,    ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.QR_CODE,  ZXing.BarcodeFormat.DATA_MATRIX,
        ZXing.BarcodeFormat.ITF,      ZXing.BarcodeFormat.PDF_417,
        ZXing.BarcodeFormat.CODE_93,
      ]);
      codeReader = new ZXing.BrowserMultiFormatReader(hints, 100);
      document.getElementById('camStatus').textContent = 'Ready — point at barcode';
      codeReader.decodeFromStream(stream, video, (result) => {
        if (!cameraActive || !result) return;
        const code = result.getText();
        document.getElementById('camStatus').textContent = '✓ ' + code;
        document.getElementById('camStatus').className = 'cam-status found';
        if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
        setTimeout(() => { closeCamera(); handleCameraResult(code); }, 200);
      });
    }
  } catch(e) {
    let msg = e.message;
    if (e.name === 'NotAllowedError') msg = 'Camera permission denied — check browser settings.';
    if (e.name === 'NotFoundError')   msg = 'No camera found on this device.';
    document.getElementById('camStatus').textContent = msg;
    document.getElementById('camStatus').className = 'cam-status err';
    cameraActive = false;
  }
}

function closeCamera() {
  cameraActive = false;
  try { if (codeReader) { codeReader.reset(); codeReader = null; } } catch(e) {}
  const v = document.getElementById('camVideo');
  try { if (v && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; } } catch(e) {}
  document.getElementById('camOverlay').classList.remove('active');
}

function handleCameraResult(code) {
  const raw = code.trim().toUpperCase();
  if (!raw) return;
  // If waiting for a pallet ID to join, fill pallet-inp directly
  if (pendingScan && palletChoice === 'join') {
    const palInp = document.getElementById('pallet-inp');
    if (palInp) {
      palInp.value = raw;
      palInp.style.borderColor = 'var(--green)';
      showToast('🪟 ' + raw + ' — enter qty and confirm', 'var(--green)');
      document.getElementById('qty-inp')?.focus();
    }
    return;
  }
  // Normal product scan — feed into scan input and run doScan
  const inp = document.getElementById('scan-inp');
  if (inp) { inp.value = raw; doScan(); return; }
  // Edge case: scan-inp not in DOM
  if (isPalletId(raw)) {
    palletLock = raw;
    showToast('🪟 Pallet ' + raw + ' locked — scan a product', 'var(--accent)');
    renderPick();
    return;
  }
  let resolvedCode = (BARCODE_LOOKUP[raw] || raw).toUpperCase();
  const product = EE_PRODUCTS[resolvedCode];
  pendingScan = product
    ? { found: true, code: resolvedCode, barcode: raw !== resolvedCode ? raw : null, bin: product.bin||'', upc: product.upc||'', gtin: product.gtin||'' }
    : { found: false, code: resolvedCode, barcode: raw !== resolvedCode ? raw : null };
  if (palletLock) palletChoice = 'join';
  renderPick();
}

boot();
</script>
